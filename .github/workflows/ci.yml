name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency (SemVer)
        run: |
          backend=$(sed -n "s:.*<Version>\(.*\)</Version>.*:\1:p" src/backend/Directory.Build.props)
          frontend=$(node -p "require('./src/frontend/web/package.json').version")
          lock=$(node -p "require('./src/frontend/web/package-lock.json').version")
          echo "backend=$backend frontend=$frontend lock=$lock"
          echo "$backend" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::Backend version '$backend' is not SemVer"; exit 1; }
          [ "$backend" = "$frontend" ] && [ "$frontend" = "$lock" ] || { echo "::error::Versions differ"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "$GITHUB_REF_NAME" = "v$backend" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version v$backend"; exit 1; }
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/backend/TravelAccounting.sln

      - name: Build
        run: dotnet build src/backend/TravelAccounting.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/TravelAccounting.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/web/package-lock.json

      - name: Install
        working-directory: src/frontend/web
        run: npm ci

      - name: Lint
        working-directory: src/frontend/web
        run: npm run lint

      - name: Typecheck
        working-directory: src/frontend/web
        run: npm run typecheck

      - name: Test
        working-directory: src/frontend/web
        run: npm run test
